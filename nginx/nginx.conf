events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # DNS resolver settings
    resolver 127.0.0.11 ipv6=off;
    
    # Basic settings
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    
    # Proxy cache configuration
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=auth_cache:10m max_size=10g inactive=60m use_temp_path=off;
    
    # Enable sub_filter module for variable substitution
    sub_filter_types *;
    sub_filter_once off;

    # OAuth2 configuration variables
    map $http_host $oauth2_client_id {
        default "nginx-client";
    }
    map $http_host $oauth2_client_secret {
        default "6ISR2zLR2P7SsTAu23rOfta0tPOBLsfF";
    }
    map $http_host $oauth2_redirect_uri {
        default "http://localhost:8080/oauth2/callback";
    }
    map $http_host $oauth2_keycloak_url {
        default "http://10.89.0.9:8080";
    }

    # Include site configurations
    include /etc/nginx/sites-enabled/*.conf;
}
