<!DOCTYPE html>
<html>
<head>
    <title>Willkommen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .token {
            word-break: break-all;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Willkommen ${given_name}!</h1>
        <p>Du hast dich erfolgreich angemeldet.</p>
        <p>Dein Access Token lautet:</p>
        <div class="token">${access_token}</div>
    </div>
</body>
</html>
