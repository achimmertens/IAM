server {
    listen 80;
    server_name localhost;

    # Protected content
    location / {
        auth_request /auth;
        auth_request_set $auth_status $upstream_status;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $given_name $upstream_http_x_given_name;
        auth_request_set $access_token $cookie_access_token;

        # Only pass these headers if authentication was successful
        if ($auth_status = 200) {
            add_header X-User $auth_user;
        }

        error_page 401 = @error401;
        root /usr/share/nginx/html;
        index index.html;

        # Replace variables in HTML
        sub_filter '${given_name}' $given_name;
        sub_filter '${access_token}' $access_token;
        sub_filter_once off;
    }

    location @error401 {
        return 302 "http://localhost:8081/realms/master/protocol/openid-connect/auth?response_type=code&client_id=nginx-client&redirect_uri=http://localhost:8080/oauth2/callback&scope=openid%20profile%20email";
    }

    location = /auth {
        internal;
        proxy_pass http://10.89.0.9:8080/realms/master/protocol/openid-connect/userinfo;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host localhost:8081;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer $cookie_access_token";
    }

    location = /oauth2/callback {
        proxy_pass http://10.89.0.9:8080/realms/master/protocol/openid-connect/token;
        proxy_set_header Host localhost:8081;
        proxy_set_header Content-Type "application/x-www-form-urlencoded";
        proxy_method POST;
        proxy_set_body "grant_type=authorization_code&client_id=nginx-client&client_secret=$oauth2_client_secret&code=$arg_code&redirect_uri=http://localhost:8080/oauth2/callback";

        add_header Set-Cookie "access_token=$upstream_http_access_token;Path=/;HttpOnly;SameSite=Lax;Max-Age=3600";
        return 302 /;
    }
}
